name: Keep-alive ping (kitekollektivet.dk)

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping all landing pages (parallel, discard body, no size limit)
        run: |
          set -uo pipefail
          echo "Pinging $(wc -l < urls.txt) URLs..."
          cat urls.txt | xargs -P 10 -I{} curl -s -o /dev/null --max-time 45 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -w "%{http_code}  %{time_total}s  {}\n" "{}" || true   
          echo "Done."
